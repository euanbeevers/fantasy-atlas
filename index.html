
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Atlas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #15151b;
    font-family: "Segoe UI", sans-serif;
}

#atlas-header {
    height: 82px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1b1b23;
    border-bottom: 1px solid #353541;
    color: #f0eee8;
}

#atlas-header h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #e4d3a2;
}

#atlas-header p {
    margin-top: 5px;
    color: #9999a8;
    font-size: 12px;
    letter-spacing: 0.5px;
}

#atlas-status {
    padding: 7px 11px;
    border: 1px solid #41414e;
    border-radius: 5px;
    color: #c4b88a;
    font-size: 10px;
    letter-spacing: 1.5px;
}

        #map-container {
            width: 100%;
            height: calc(100% - 82px);
            overflow: hidden;
            position: relative;
            cursor: grab;
            user-select: none;
            touch-action: none;

            background: #101015;
            box-shadow: inset 0 0 0 1px #353541;
        }

        #map-container.dragging {
            cursor: grabbing;
        }

        #world-map {
            position: absolute;
            top: 0;
            left: 0;
            max-width: none;
            pointer-events: none;
            transform-origin: top left;
            -webkit-user-drag: none;
            image-rendering: auto;
        }

        /* Floating zoom controls */
        #zoom-controls {
            position: absolute;
            right: 24px;
            bottom: 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            touch-action: manipulation;
        }

        .zoom-button {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 242, 194, 0.3);
            border-radius: 14px;
            background: rgba(23, 20, 33, 0.72);
            color: #fff2c2;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .zoom-button:hover {
            background: rgba(48, 48, 61, 0.96);
            border-color: rgba(228, 211, 162, 0.65);
            transform: scale(1.06);
        }

        .zoom-button:active {
            transform: scale(0.94);
        }

        .zoom-button:focus-visible {
            outline: 2px solid #e8c46a;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            #zoom-controls {
                right: 16px;
                bottom: 16px;
            }

            .zoom-button {
                width: 46px;
                height: 46px;
            }
        }


        /* Dungeon Master toolbar */
        #dm-toolbar {
            position: relative;
            z-index: 20;
            background: #1b1b23;
            border-bottom: 1px solid #353541;
            color: #f0eee8;
        }

        #toolbar-toggle {
            width: 100%;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border: none;
            color: #e4d3a2;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
        }

        #toolbar-toggle:hover {
            background: #252530;
        }

        #toolbar-arrow {
            font-size: 10px;
            transition: transform 0.2s ease;
        }

        #toolbar-content {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0 24px 14px;
        }

        #toolbar-content button {
            padding: 9px 14px;
            background: #252530;
            border: 1px solid #41414e;
            border-radius: 5px;
            color: #e5e3ec;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        #toolbar-content button:hover {
            background: #30303d;
            border-color: #c4b88a;
        }

        #toolbar-hint {
            color: #9999a8;
            font-size: 11px;
        }

/* Lore Sidebar */
#lore-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 290px;
    z-index: 30;
    background: #1b1b23;
    border-right: 1px solid #353541;
    color: #f0eee8;
    transform: translateX(-290px);
    transition: transform 0.25s ease;
}

#lore-sidebar.open {
    transform: translateX(0);
}

#lore-toggle {
    position: absolute;
    top: 50%;
    left: 100%;
    transform: translateY(-50%);
    width: 28px;
    height: 64px;
    border: 1px solid #41414e;
    border-left: none;
    border-radius: 0 8px 8px 0;
    background: #1b1b23;
    color: #e4d3a2;
    cursor: pointer;
}

#lore-content {
    padding: 28px 18px;
}

#lore-content h2 {
    color: #e4d3a2;
    font-size: 15px;
    letter-spacing: 3px;
}

.lore-subtitle {
    margin-top: 8px;
    margin-bottom: 28px;
    color: #9999a8;
    font-size: 12px;
}

.lore-category {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding: 16px 12px;
    background: #252530;
    border: 1px solid #41414e;
    border-radius: 7px;
    color: #f0eee8;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
}

.lore-category:hover {
    background: #30303d;
    border-color: #c4b88a;
}

.category-arrow {
    margin-left: auto;
    color: #e4d3a2;
    font-size: 16px;
    line-height: 1;
}


/* Settlement list */
#locations-list {
    margin-top: 4px;
    padding-bottom: 20px;
}

.location-item {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    padding: 12px;
    margin-bottom: 6px;
    background: #20202a;
    border: 1px solid #353541;
    border-radius: 5px;
    color: #f0eee8;
    text-align: left;
    cursor: pointer;
}

.location-item span {
    font-size: 13px;
    font-weight: 600;
}

.location-item small {
    color: #9999a8;
    font-size: 11px;
}

.location-item:hover {
    background: #30303d;
    border-color: #c4b88a;
}

#lore-sidebar {
    overflow: visible;
}

#lore-content {
    max-height: 100vh;
    overflow-y: auto;
}

/* Marker options - match the sidebar theme */
#markers-content button {
    width: 100%;
    padding: 16px 12px;
    margin-bottom: 8px;
    background: #252530;
    border: 1px solid #41414e;
    border-radius: 7px;
    color: #f0eee8;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
}

#markers-content button:hover {
    background: #30303d;
    border-color: #c4b88a;
}

#markers-content button:focus {
    outline: none;
}

    </style>
</head>

    <header id="atlas-header">
        <div>
            <h1>FANTASY ATLAS</h1>
            <p>Explore a world beyond the known.</p>
        </div>
        <span id="atlas-status">WORLD MAP</span>
    </header>

    <div id="map-container">
        <img
            id="world-map"
            src="world_map.png"
            alt="Fantasy world map"
            draggable="false"
        >

        <div id="zoom-controls">
            <button
                class="zoom-button"
                id="zoom-in"
                type="button"
                aria-label="Zoom in"
                title="Zoom in"
            >+</button>

            <button
                class="zoom-button"
                id="zoom-out"
                type="button"
                aria-label="Zoom out"
                title="Zoom out"
            >−</button>
        </div>

        <script src="quests.js"></script>
<script>
    const container = document.getElementById("map-container");
    const map = document.getElementById("world-map");

        let zoom = 1;
        const minZoom = 0.25;
        const maxZoom = 5;

        let offsetX = 0;
        let offsetY = 0;

        let dragging = false;
        let lastX = 0;
        let lastY = 0;

        function drawMap() {
            map.style.transform =
                `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
        }

        function zoomMap(factor, mouseX, mouseY) {
            const oldZoom = zoom;

            zoom = Math.max(
                minZoom,
                Math.min(maxZoom, zoom * factor)
            );

            if (zoom === oldZoom) return;

            // Keep the chosen point in the same screen position
            offsetX = mouseX - (mouseX - offsetX) * (zoom / oldZoom);
            offsetY = mouseY - (mouseY - offsetY) * (zoom / oldZoom);

            drawMap();
        }

        // Mouse-wheel zooming
        container.addEventListener("wheel", function(event) {
            event.preventDefault();

            const rect = container.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            zoomMap(
                event.deltaY < 0 ? 1.15 : 1 / 1.15,
                mouseX,
                mouseY
            );
        }, { passive: false });

        // Zoom buttons: zoom towards the centre of the screen
        document.getElementById("zoom-in").addEventListener("click", function() {
            zoomMap(
                1.25,
                container.clientWidth / 2,
                container.clientHeight / 2
            );
        });

        document.getElementById("zoom-out").addEventListener("click", function() {
            zoomMap(
                1 / 1.25,
                container.clientWidth / 2,
                container.clientHeight / 2
            );
        });

        // Click-and-drag map movement
        container.addEventListener("pointerdown", function(event) {
            if (event.button !== 0) return;

            // Don't start dragging when a zoom button is clicked
            if (event.target.closest("button")) return;

            dragging = true;
            lastX = event.clientX;
            lastY = event.clientY;

            container.classList.add("dragging");
            container.setPointerCapture(event.pointerId);
        });

        container.addEventListener("pointermove", function(event) {
            if (!dragging) return;

            offsetX += event.clientX - lastX;
            offsetY += event.clientY - lastY;

            lastX = event.clientX;
            lastY = event.clientY;

            drawMap();
        });

        function stopDragging() {
            dragging = false;
            container.classList.remove("dragging");
        }

        container.addEventListener("pointerup", stopDragging);
        container.addEventListener("pointercancel", stopDragging);

        drawMap();


        // Toggle the Markers category open and closed
        const toolbarToggle = document.getElementById("markers-category");
        const toolbarContent = document.getElementById("markers-content");
        const toolbarArrow = document.getElementById("markers-arrow");

        toolbarToggle.addEventListener("click", function() {
            const isOpen = toolbarContent.style.display !== "none";

            toolbarContent.style.display = isOpen ? "none" : "flex";
            toolbarArrow.textContent = isOpen ? "›" : "⌄";
        });


        // Track the selected marker tool
        let selectedMarkerType = null;

        const individualTool = document.getElementById("individual-tool");
        const groupTool = document.getElementById("group-tool");

        
individualTool.addEventListener("click", function() {
    if (selectedMarkerType === "individual") {
        selectedMarkerType = null;
        toolbarHint.textContent = "Marker placement deactivated";
    } else {
        selectedMarkerType = "individual";
        toolbarHint.textContent = "Click the map to place an individual marker";
    }

    updateMarkerTools();
});

groupTool.addEventListener("click", function() {
    if (selectedMarkerType === "group") {
        selectedMarkerType = null;
        toolbarHint.textContent = "Marker placement deactivated";
    } else {
        selectedMarkerType = "group";
        toolbarHint.textContent = "Click the map to place a group marker";
    }

    updateMarkerTools();
});


        const toolbarHint = document.getElementById("toolbar-hint");

        function updateMarkerTools() {
            individualTool.style.borderColor =
                selectedMarkerType === "individual" ? "#5799ff" : "#41414e";

            groupTool.style.borderColor =
                selectedMarkerType === "group" ? "#54c987" : "#41414e";
        }


        
        // Place and remove temporary campaign markers
        const markersLayer = document.createElement("div");
        markersLayer.id = "markers-layer";

        Object.assign(markersLayer.style, {
            position: "absolute",
            top: "0",
            left: "0",
            width: "100%",
            height: "100%",
            zIndex: "4",
            pointerEvents: "none"
        });

        container.appendChild(markersLayer);

        // Keep the marker layer aligned with the map
        function updateMarkersLayer() {
            markersLayer.style.transform =
                `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
            markersLayer.style.transformOrigin = "top left";
        }

        // Replace drawMap with a version that also moves the markers
        const drawMapOriginal = drawMap;

        drawMap = function() {
            drawMapOriginal();
            updateMarkersLayer();
        };

        // Place or remove markers
        container.addEventListener("click", function(event) {
            if (event.target.closest("button")) return;

// If a marker was clicked, remove it and stop here
if (event.target.closest(".campaign-marker")) {
    return;
}

            if (!selectedMarkerType || dragging) return;

            const rect = container.getBoundingClientRect();
            const screenX = event.clientX - rect.left;
            const screenY = event.clientY - rect.top;

            const mapX = (screenX - offsetX) / zoom;
            const mapY = (screenY - offsetY) / zoom;

            
const marker = document.createElement("div");
marker.className = "campaign-marker";

const isGroup = selectedMarkerType === "group";
const markerSize = isGroup ? "24px" : "18px";

Object.assign(marker.style, {
    position: "absolute",
    left: mapX + "px",
    top: mapY + "px",
    width: markerSize,
    height: markerSize,
    boxSizing: "border-box",
    borderRadius: "50%",
    background: isGroup
        ? document.getElementById("group-colour").value
        : document.getElementById("individual-colour").value,
    border: "2px solid white",
    boxShadow: "0 0 8px rgba(0,0,0,0.7)",
    transform: "translate(-50%, -50%)",
    pointerEvents: "auto",
    cursor: "pointer",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    color: "white",
    fontSize: "13px",
    fontWeight: "bold"
});

if (isGroup) {
    marker.textContent = "G";
}

marker.title = isGroup
    ? "Group marker — click to remove"
    : "Individual marker — click to remove";


            marker.addEventListener("pointerdown", function(event) {
    event.stopPropagation();
});

const addCreatureButton = document.getElementById("add-creature");

function addRemoveButton(creatureButton) {
    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.textContent = "−";

    removeButton.style.cssText = `
        position: absolute;
        top: 5px;
        right: 7px;
        background: transparent;
        border: none;
        color: #c4b88a;
        font-size: 20px;
        cursor: pointer;
        padding: 0 5px;
        line-height: 1;
    `;

    removeButton.addEventListener("click", function(event) {
    event.stopPropagation();

    removeCreatureWithUndo(creatureButton);
});

    creatureButton.style.position = "relative";
    creatureButton.appendChild(removeButton);
}

let undoTimer;
let removedCreature = null;
let undoNotification = null;

function removeCreatureWithUndo(creatureButton) {
    // Cancel any previous undo timer
    clearTimeout(undoTimer);

    // Remove the previous notification
    if (undoNotification) {
        undoNotification.remove();
    }

    // Remember where the creature was
    const parent = creatureButton.parentNode;
    const nextSibling = creatureButton.nextSibling;

    removedCreature = {
        element: creatureButton,
        parent: parent,
        nextSibling: nextSibling
    };

    // Remove the creature
    creatureButton.remove();

    // Create the bottom-of-screen notification
    undoNotification = document.createElement("div");
    undoNotification.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        background: #211d2d;
        color: #f3efff;
        border: 1px solid #c4b88a;
        border-radius: 8px;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    `;

    const message = document.createElement("span");
    message.textContent = "Creature removed";

    const undoButton = document.createElement("button");
    undoButton.type = "button";
    undoButton.textContent = "Undo";
    undoButton.style.cssText = `
        background: transparent;
        color: #c4b88a;
        border: 1px solid #c4b88a;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
        font-weight: bold;
    `;

    undoButton.addEventListener("click", function() {
        clearTimeout(undoTimer);

        if (removedCreature) {
            const item = removedCreature;

            if (item.nextSibling && item.nextSibling.parentNode === item.parent) {
                item.parent.insertBefore(item.element, item.nextSibling);
            } else {
                item.parent.appendChild(item.element);
            }
        }

        undoNotification.remove();
        undoNotification = null;
        removedCreature = null;
    });

    undoNotification.appendChild(message);
    undoNotification.appendChild(undoButton);
    document.body.appendChild(undoNotification);

    // Automatically dismiss after 7.5 seconds
    undoTimer = setTimeout(function() {
        if (undoNotification) {
            undoNotification.remove();
            undoNotification = null;
        }

        removedCreature = null;
    }, 7500);
}

// Roll a random integer
const diceMinimum = document.getElementById("dice-minimum");
const diceMaximum = document.getElementById("dice-maximum");
const rollDice = document.getElementById("roll-dice");
const diceResult = document.getElementById("dice-result");
const diceError = document.getElementById("dice-error");

rollDice.addEventListener("click", function() {
    const min = Number(diceMinimum.value);
    const max = Number(diceMaximum.value);

    if (
        diceMinimum.value.trim() === "" ||
        diceMaximum.value.trim() === "" ||
        !Number.isSafeInteger(min) ||
        !Number.isSafeInteger(max) ||
        min > max
    ) {
        diceError.textContent =
            "Enter whole numbers, with the minimum no greater than the maximum.";
        diceResult.textContent = "—";
        return;
    }

    diceError.textContent = "";

    const result = Math.floor(Math.random() * (max - min + 1)) + min;

    diceResult.textContent = result;
});

 // Generate quests without repeating until the pool is exhausted
const generateQuestButton = document.getElementById("generate-quest");
const questDisplay = document.getElementById("quest-display");
const questTitle = document.getElementById("quest-title");
const questDescription = document.getElementById("quest-description");

let selectedQuestLocation = "Icehelm";
let remainingGlobalQuests = [...(questDatabase.locations[selectedQuestLocation] || [])];

generateQuestButton.addEventListener("click", function() {
    // Reset the pool after every quest has been seen
    if (remainingGlobalQuests.length === 0) {
    remainingGlobalQuests = [
        ...(questDatabase.locations[selectedQuestLocation] || [])
    ];
}

    if (remainingGlobalQuests.length === 0) {
        questTitle.textContent = "No quests available";
        questDescription.textContent = "There are currently no quests in this location.";
        questDisplay.style.display = "block";
        return;
    }

    // Pick a random quest that hasn't been seen this cycle
    const randomIndex = Math.floor(
        Math.random() * remainingGlobalQuests.length
    );

    const quest = remainingGlobalQuests.splice(randomIndex, 1)[0];

    questTitle.textContent = quest.title;
    questDescription.textContent = quest.description;
    questDisplay.style.display = "block";
});
